name: Docs Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "24.17.0"

jobs:
  build:
    name: Build docs
    outputs:
      cname: ${{ steps.pages.outputs.cname }}
      public-url: ${{ steps.pages.outputs.url }}
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Verify concurrent Pages publication
        run: |
          python3 scripts/test-pages-push.py
          python3 scripts/test-pages-config.py

      - name: Setup Go for runtime catalog export
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache: false

      - name: Isolate exporter module downloads
        run: echo "GOMODCACHE=$RUNNER_TEMP/printing-go-modules" >> "$GITHUB_ENV"

      - name: Prepare pinned catalog build dependencies
        run: |
          go list -mod=readonly -buildvcs=false -deps ./apps/api/cmd/label-catalog ./apps/cli/cmd/stuffstash > /dev/null
          (cd apps/api && GOWORK=off go mod verify)
          (cd apps/cli && GOWORK=off go mod verify)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.7 --activate

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Configure public Pages destination
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"
          args=()
          if [ -n "$PREVIEW_NUMBER" ]; then args+=(--preview "$PREVIEW_NUMBER"); fi
          python3 scripts/configure-pages.py "$RUNNER_TEMP/pages.json" "${args[@]}" --env-file "$GITHUB_ENV" --output-file "$GITHUB_OUTPUT"

      - name: Verify generated download documentation
        run: python3 scripts/generate-cli-downloads.py --check

      - name: Generate and check runtime printing catalog
        id: printing_catalog
        continue-on-error: true
        run: make printing-docs-check-generated PRINTING_DOCS_OUTPUT="$RUNNER_TEMP/printing-docs"

      - name: Build candidate documentation
        run: |
          test -f "$RUNNER_TEMP/printing-docs/docs/src/assets/printing/generated/manifest.json"
          cp -R "$RUNNER_TEMP/printing-docs/docs/." docs/
          pnpm --dir docs build

      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 1

      - name: Reject stale checked-in printing documentation
        if: steps.printing_catalog.outcome != 'success'
        run: |
          echo 'Printing documentation is stale. Run make printing-docs-generate and commit the output. The docs-dist artifact contains the newly rendered candidate.' >&2
          exit 1

  deploy:
    name: Deploy docs
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Pages publication helper
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.sha || 'main' }}
          path: tooling
          persist-credentials: false
          sparse-checkout: scripts/push-pages.sh
          sparse-checkout-cone-mode: false

      - name: Checkout Pages branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
        continue-on-error: true

      - name: Initialize Pages branch
        run: |
          if [ ! -d pages/.git ]; then
            mkdir -p pages
            cd pages
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download docs artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: docs-dist
          path: built-docs

      - name: Publish production docs
        if: github.event_name != 'pull_request'
        env:
          PAGES_CNAME: ${{ needs.build.outputs.cname }}
        run: |
          mkdir -p pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name 'pr-*' -exec rm -rf {} +
          cp -R built-docs/. pages/
          if [ -n "$PAGES_CNAME" ]; then printf '%s\n' "$PAGES_CNAME" > pages/CNAME; fi
          touch pages/.nojekyll

      - name: Publish pull request preview
        if: github.event_name == 'pull_request'
        run: |
          preview_dir="pages/pr-${{ github.event.pull_request.number }}"
          rm -rf "$preview_dir"
          mkdir -p "$preview_dir"
          cp -R built-docs/. "$preview_dir/"
          touch pages/.nojekyll

      - name: Commit and push Pages branch
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi
          git commit -m "Deploy documentation site"
          bash ../tooling/scripts/push-pages.sh

      - name: Report preview URL
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_URL: ${{ needs.build.outputs.public-url }}
        run: |
          printf 'Preview URL: %s\n' "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: Clean up docs preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Pages publication helper
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.sha || 'main' }}
          path: tooling
          persist-credentials: false
          sparse-checkout: scripts/push-pages.sh
          sparse-checkout-cone-mode: false

      - name: Checkout Pages branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Remove pull request preview
        run: |
          cd pages
          rm -rf "pr-${{ github.event.pull_request.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview content to remove."
            exit 0
          fi
          git commit -m "Remove documentation preview for PR ${{ github.event.pull_request.number }}"
          bash ../tooling/scripts/push-pages.sh
