name: TestFlight changelog

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_number:
        required: true
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag
        required: true
        type: string
      build_number:
        description: Exact uploaded TestFlight build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-notes-${{ inputs.release_tag }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted tooling and release history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.17.0"
      - name: Publish and verify TestFlight changelog
        env:
          STUFF_STASH_MOBILE_RELEASE_TAG: ${{ inputs.release_tag }}
          MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
          MOBILE_BUNDLE_ID: org.stuffstash.mobile
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/testflight-notes.mjs
