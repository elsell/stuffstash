name: Mobile native audit

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Diagnostic selection; only all can support full native acceptance'
        type: choice
        required: true
        default: all
        options:
          - all
          - color-picker
          - filter-search-timing
          - search-placement
          - text-entry
          - text-entry-no-provider
          - add-draft
          - home-header
          - browse-journey
          - browse-filter-journey
          - filter-sharing-workflows
          - followup-release
          - filters
          - release-corrections
          - menu-ownership
          - archive-notice
          - onboarding-keyboard
          - move-destination
          - move-selection-workflows
          - destination-and-field-choices
          - field-choices
          - enum-editing
          - workflow-batch
          - hierarchy-followup
          - asset-workflows
          - asset-edit-journey
          - edit-recovery
          - edit-tags
          - add-destination
          - tag-selection
          - selection-lifecycle
          - normal-detail-recovery
          - edit-and-move-drafts
          - settings-editing
          - settings-readback
          - settings-move-release
          - enum-and-settings
  pull_request:
    paths:
      - '.github/workflows/mobile-native-audit.yml'
      - 'apps/mobile/native-audit/**'
      - 'scripts/prepare-ios-audit-target.rb'
      - 'scripts/prepare-mobile-audit-fixtures.py'
      - 'scripts/test-prepare-mobile-audit-fixtures.py'

permissions:
  contents: read

concurrency:
  group: mobile-native-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.17.0'
  PNPM_VERSION: '11.0.7'
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  ios:
    name: iOS ${{ matrix.suite }} (${{ matrix.device }})${{ inputs.test_case && inputs.test_case != 'all' && format(' [{0}]', inputs.test_case) || '' }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 17', 'iPad mini (A17 Pro)']
        suite: ${{ github.event_name == 'workflow_dispatch' && inputs.test_case != 'all' && fromJSON('["fixtures"]') || fromJSON('["onboarding", "fixtures"]') }}
    env:
      NODE_ENV: production
      AUDIT_SUITE: ${{ matrix.suite }}
      AUDIT_TEST_CASE: ${{ inputs.test_case || 'all' }}
      EX_DEV_CLIENT_NETWORK_INSPECTOR: 'false'
      STUFF_STASH_MOBILE_GENERAL_DISTRIBUTION_BUILD: 'true'
      EXPO_PUBLIC_STUFF_STASH_API_BASE_URL: ''
      EXPO_PUBLIC_STUFF_STASH_TENANT_ID: ''
      EXPO_PUBLIC_STUFF_STASH_INVITATION_ORIGIN: ''
      EXPO_PUBLIC_STUFF_STASH_VOICE_DIAGNOSTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned toolchain and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm install --frozen-lockfile
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
          test "$(pod --version)" = '1.17.0'
          python3 scripts/test-prepare-mobile-audit-fixtures.py
      - name: Install native dependencies
        working-directory: apps/mobile/ios
        run: pod install --deployment
      - name: Add runner-only XCTest target
        run: ruby scripts/prepare-ios-audit-target.rb
      - name: Install isolated fixture routes
        if: matrix.suite == 'fixtures'
        run: python3 scripts/prepare-mobile-audit-fixtures.py
      - name: Run native interaction audit
        env:
          AUDIT_DEVICE: ${{ matrix.device }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/native-audit"
          audit_test_args=()
          hierarchy_test_args=(
            '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMapRootContextAndAncestorReturn'
            '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEmptyPhotoDetailPrioritizesIdentityAndActions'
            '-only-testing:StuffStashAuditTests/FixtureAuditTests/testDetailContextVariantsKeepNativeCommandsAndStatus'
            '-only-testing:StuffStashAuditTests/FixtureAuditTests/testDetailCommandsRemainReachableAtNormalTextSize'
            '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetRegionsRecoverAtNormalTextSize'
          )
          case "$AUDIT_TEST_CASE" in
            all) ;;
            archive-notice)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsEditorNativeArchiveConfirmsBeforeReturning'
              )
              ;;
            move-selection-workflows)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetMoveReturnsToUpdatedDetailAndReopensSelection'

                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereRejectedCommandRetainsSelectionAndRetryReturns'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              )
              ;;
            move-destination)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDraftWithHeaderConfiguredBeforePresentation'
              )
              ;;
            destination-and-field-choices)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testCustomFieldChoicesStayInPlaceAndRetainTargets'
              )
              ;;
            enum-and-settings)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEnumOptionEntryRetainsDuplicateAndClearsAcceptedDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsFullNameSurvivesRejectedSaveAndRetry'
              )
              ;;
            settings-move-release)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsSaveReadsBackFromTheSameCollection'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsCollectionUsesNativeSearchAndAdd'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetMoveReturnsToUpdatedDetailAndReopensSelection'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereRejectedCommandRetainsSelectionAndRetryReturns'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              ) ;;
            settings-readback)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=("-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsSaveReadsBackFromTheSameCollection") ;;
            settings-editing)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsFullNameSurvivesRejectedSaveAndRetry'
              )
              ;;
            edit-and-move-drafts)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditMetadataRecoveryRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              )
              ;;
            normal-detail-recovery)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditMetadataRecoveryRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testDetailCommandsRemainReachableAtNormalTextSize'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetRegionsRecoverAtNormalTextSize'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              )
              ;;
            add-destination)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDestinationSelectionPreservesDraftAndRecoversCreation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
              )
              ;;
            selection-lifecycle)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDestinationSelectionPreservesDraftAndRecoversCreation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddTagSelectionRetainsDraftAcrossCancelAndSaveFailure'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddRetainsUnfinishedTagAcrossDetailsDisclosure'
              )
              ;;
            tag-selection)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddTagSelectionRetainsDraftAcrossCancelAndSaveFailure'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
              )
              ;;
            edit-tags)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
              )
              ;;
            hierarchy-followup)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=("${hierarchy_test_args[@]}")

              ;;
            workflow-batch)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseViewSwitcherStaysAnchoredAcrossListMapAndScroll'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseGridFitsDeviceWidth'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetEditSavesAndReturnsToUpdatedDetail'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetMoveReturnsToUpdatedDetailAndReopensSelection'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditMetadataRecoveryRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              )
              ;;
            asset-workflows)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetEditSavesAndReturnsToUpdatedDetail'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetMoveReturnsToUpdatedDetailAndReopensSelection'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditTagDisclosureRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditMetadataRecoveryRetainsNormalTextDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveHereSuggestionsRecoverAtNormalTextSize'
              )
              ;;
            asset-edit-journey)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetEditSavesAndReturnsToUpdatedDetail'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAssetMoveReturnsToUpdatedDetailAndReopensSelection'
              )
              ;;
            edit-recovery)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEditMetadataRecoveryRetainsNormalTextDraft'
              )
              ;;
            enum-editing)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testEnumOptionEntryRetainsDuplicateAndClearsAcceptedDraft'
              )
              ;;
            field-choices)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testCustomFieldChoicesStayInPlaceAndRetainTargets'
              )
              ;;
            onboarding-keyboard)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOnboardingConnectRemainsReachableWithKeyboardOpen'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOnboardingKeyboardGoSubmitsCompleteAddress'
              )
              ;;
            menu-ownership)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testNativeMenuLocksOpenActionsAndRecovers'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseUsesInPlaceAvailabilityMenuAndReachableActions'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsEditorNativeArchiveConfirmsBeforeReturning'
              )
              ;;
            search-placement)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testPlaceContentsUseNativeSearchAndKeepNavigation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testPreconfiguredPlaceSearchKeepsProductionHandlersAndNavigation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testManagedSearchPlacementAfterEnableAndHeaderUpdate'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testVoiceProposalLocationSearchRetryAndReturn'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testStaticNativeSearchPlacementComparison'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsCollectionUsesNativeSearchAndAdd'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseTagSearchKeepsActionsAboveKeyboardAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationSearchKeepsActionsReachableWithKeyboard'
              )
              ;;
            filter-search-timing)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseTagSearchKeepsActionsAboveKeyboardAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationSearchKeepsActionsReachableWithKeyboard'
              )
              ;;
            color-picker)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorPickerOpensDirectlyAndClearPreservesParentDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorFirstTapWithPreTapCapture'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorFirstTapWithoutPreTapCapture'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorFirstTapWithoutScrolling'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorWellTargetOpensSystemPicker'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorWellHasSingleAccessibleName'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorWellDeliveredTouchRegion'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testNativeColorRedEditsPreserveOtherChannelsInDraft'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testNativeColorLockDisablesTheWellAndPreservesDraft'
              )
              ;;
            browse-filter-journey|filter-sharing-workflows|followup-release)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseFiltersDetailAndBackPreserveContext'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseExpirationDetailAndBackPreserveContext'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testPlaceContentsUseNativeSearchAndKeepNavigation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseExpirationReviewUsesOverviewMenu'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationSheetBodySurvivesExpansion'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseLastTagClearsActionFooterAndApplies'
              )
              if [ "$AUDIT_TEST_CASE" != browse-filter-journey ]; then
                audit_test_args+=('-only-testing:StuffStashAuditTests/FixtureAuditTests/testSharingRecoveryKeepsHeaderAndCommandsReachable')
              fi
              if [ "$AUDIT_TEST_CASE" = followup-release ]; then
                audit_test_args+=("${hierarchy_test_args[@]}")
                audit_test_args+=(
                  '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDestinationSelectionPreservesDraftAndRecoversCreation'
                  '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddTagSelectionRetainsDraftAcrossCancelAndSaveFailure'
                  '-only-testing:StuffStashAuditTests/FixtureAuditTests/testMoveDestinationCreationRetainsDraftAndRetries'
                )
              fi
              ;;
            browse-journey)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseViewSwitcherStaysAnchoredAcrossListMapAndScroll'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseGridFitsDeviceWidth'
              )
              ;;
            home-header)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testHomeHeaderKeepsAllActionsAboveScrollingContent'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testHomeNotificationHitRegionBeyondAccessibilityFrame'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testHomeAddHitRegionBeyondAccessibilityFrame'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testHomeProfileHitRegionBeyondAccessibilityFrame'
              )
              ;;
            add-draft)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDraftRetainsTextAndRecoversAfterRejectedSave'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDraftInNavigationStack'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDraftWithHeaderConfiguredBeforePresentation'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddPhotoPreviewPagingAndDraftRemoval'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddRetainsUnfinishedTagAcrossDetailsDisclosure'
              )
              ;;
            filters)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseExpirationReviewUsesOverviewMenu'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseTagSearchKeepsActionsAboveKeyboardAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseLastTagClearsActionFooterAndApplies'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseUsesInPlaceAvailabilityMenuAndReachableActions'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationDatePageKeepsBottomActionsReachable'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationSearchKeepsActionsReachableWithKeyboard'
              )
              ;;
            release-corrections)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseTagSearchKeepsActionsAboveKeyboardAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseLastTagClearsActionFooterAndApplies'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testBrowseUsesInPlaceAvailabilityMenuAndReachableActions'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationDatePageKeepsBottomActionsReachable'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testExpirationSearchKeepsActionsReachableWithKeyboard'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSharingRecoveryKeepsHeaderAndCommandsReachable'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSettingsCollectionUsesNativeSearchAndAdd'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testAddDraftRetainsTextAndRecoversAfterRejectedSave'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testColorPickerOpensDirectlyAndClearPreservesParentDraft'
              )
              ;;
            text-entry|text-entry-no-provider)
              test "$AUDIT_SUITE" = fixtures || exit 1
              audit_test_args=(
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testControlledAddressEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testUncontrolledAddressEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSeededAddressWithoutKeyboardAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testSystemAddressEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOrdinarySingleLineTextEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testNativeDefaultAssistedTextEntryDiagnostic'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOrdinaryMultilineTextEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOrdinaryControlledTextEntry'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testControlledTextEntryWithoutAssistance'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testControlledTextEntryWithoutAccessory'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testPacedControlledTextEntryDiagnostic'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testPacedUncontrolledTextEntryDiagnostic'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOrdinaryTextEntryWithoutAssistance'
                '-only-testing:StuffStashAuditTests/FixtureAuditTests/testOrdinaryTextEntryWithoutAccessory'
              )
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$AUDIT_TEST_CASE" > "$RUNNER_TEMP/native-audit/selection.txt"
          xcrun simctl list devices available > "$RUNNER_TEMP/native-audit/simulators.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-audit/revision.txt"
          xcodebuild test \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 600 \
            "${audit_test_args[@]}" \
            -workspace apps/mobile/ios/StuffStash.xcworkspace \
            -scheme StuffStashAudit \
            -configuration Release \
            -destination "platform=iOS Simulator,name=$AUDIT_DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/native-audit/results.xcresult" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/native-audit/xcodebuild.log"
      - name: Export screenshots for review
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/native-audit/results.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/native-audit/results.xcresult" \
              --output-path "$RUNNER_TEMP/native-audit/screenshots"
          fi
      - name: Export result-bundle diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/native-audit/diagnostics"
          if [ -d "$RUNNER_TEMP/native-audit/results.xcresult" ]; then
            xcrun xcresulttool export diagnostics \
              --path "$RUNNER_TEMP/native-audit/results.xcresult" \
              --output-path "$RUNNER_TEMP/native-audit/diagnostics/result-bundle" \
              > "$RUNNER_TEMP/native-audit/diagnostics/export.log" 2>&1
          else
            printf '%s\n' 'No xcresult bundle available for diagnostic export.' \
              > "$RUNNER_TEMP/native-audit/diagnostics/export.log"
          fi
      - name: Collect application crash evidence
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          output = Path(os.environ["RUNNER_TEMP"]) / "native-audit" / "diagnostics"
          output.mkdir(parents=True, exist_ok=True)
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          for report in reports.glob("StuffStash*"):
              if report.is_file():
                  shutil.copy2(report, output / report.name)
          devices = subprocess.run(["xcrun", "simctl", "list", "devices", "booted", "--json"], capture_output=True, text=True, check=True)
          for runtime in json.loads(devices.stdout).get("devices", {}).values():
              for device in runtime:
                  if device.get("state") != "Booted":
                      continue
                  with (output / (device["udid"] + "-application.log")).open("w") as log:
                      try:
                          subprocess.run(["xcrun", "simctl", "spawn", device["udid"], "log", "show", "--last", "1h", "--style", "compact", "--predicate", 'process == "StuffStash"'], stdout=log, stderr=subprocess.STDOUT, timeout=60, check=False)
                      except subprocess.TimeoutExpired:
                          log.write("Application log collection timed out for this simulator.\n")
          PYTHON
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-audit-${{ matrix.suite }}-${{ matrix.device }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-audit
          retention-days: 14
          if-no-files-found: warn
