name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.env.example'
  workflow_dispatch:
    inputs:
      repair_run_id:
        description: 'Resume exact retained assets from a completed Release run (no rebuild)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.8"
  NODE_VERSION: "24.17.0"
  PNPM_VERSION: "11.0.7"

jobs:
  validate:
    name: Validate release inputs
    if: github.ref == 'refs/heads/main' && inputs.repair_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_required: ${{ steps.plan.outputs.release_required }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      next_version: ${{ steps.plan.outputs.next_version }}
      next_tag: ${{ steps.plan.outputs.next_tag }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        run: scripts/plan-release.sh --github-output

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Run required checks
        run: make required-checks
        env:
          STUFF_STASH_STRUCTURAL_BASE: ${{ github.event.before }}

      - name: Report no release
        if: steps.plan.outputs.release_required != 'true'
        run: echo "No release-worthy Conventional Commits since ${{ steps.plan.outputs.previous_tag }}."

  publish:
    name: Publish release images and attestations
    needs: validate
    if: needs.validate.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Refuse existing release tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ needs.validate.outputs.next_tag }}" >/dev/null; then
            echo "Release tag ${{ needs.validate.outputs.next_tag }} already exists." >&2
            exit 1
          fi

      - name: Setup Node for maintenance metadata
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go for CLI releases
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build portable CLI archives
        run: scripts/build-cli-release.sh "${{ needs.validate.outputs.next_tag }}" "$GITHUB_SHA" release-dist

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build and push API image by commit
        id: api_image
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/stuffstash"
          sha_tag="sha-${GITHUB_SHA}"

          docker buildx build \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ needs.validate.outputs.next_tag }}" \
            --tag "${image}:${sha_tag}" \
            --metadata-file api-image-metadata.json \
            .

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("api-image-metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          digest = metadata.get("containerimage.digest")
          if not digest:
              digest = metadata.get("containerimage.descriptor", {}).get("digest")
          if not digest:
              raise SystemExit("buildx metadata did not include container image digest")
          print(f"digest={digest}")
          PY

          printf 'image=%s\n' "${image}" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s@%s\n' "${image}" "$(python3 -c 'import json; m=json.load(open("api-image-metadata.json")); print(m.get("containerimage.digest") or m.get("containerimage.descriptor", {}).get("digest"))')" >> "$GITHUB_OUTPUT"

      - name: Build and push web image by commit
        id: web_image
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/stuffstash-web"
          sha_tag="sha-${GITHUB_SHA}"

          docker buildx build \
            --file Dockerfile.web \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ needs.validate.outputs.next_tag }}" \
            --tag "${image}:${sha_tag}" \
            --metadata-file web-image-metadata.json \
            .

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("web-image-metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          digest = metadata.get("containerimage.digest")
          if not digest:
              digest = metadata.get("containerimage.descriptor", {}).get("digest")
          if not digest:
              raise SystemExit("buildx metadata did not include container image digest")
          print(f"digest={digest}")
          PY

          printf 'image=%s\n' "${image}" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s@%s\n' "${image}" "$(python3 -c 'import json; m=json.load(open("web-image-metadata.json")); print(m.get("containerimage.digest") or m.get("containerimage.descriptor", {}).get("digest"))')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22

      - name: Sign images
        run: |
          scripts/sign-release-images.sh \
            "${{ steps.api_image.outputs.image_ref }}" \
            "${{ steps.web_image.outputs.image_ref }}"

      - name: Verify image signatures
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.api_image.outputs.image_ref }}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.web_image.outputs.image_ref }}"

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ${{ steps.api_image.outputs.image }}
          subject-digest: ${{ steps.api_image.outputs.digest }}
          push-to-registry: true

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ${{ steps.web_image.outputs.image }}
          subject-digest: ${{ steps.web_image.outputs.digest }}
          push-to-registry: true

      - name: Build self-host release bundle
        run: |
          scripts/build-selfhost-release.sh \
            --version "${{ needs.validate.outputs.next_tag }}" \
            --api-image "${{ steps.api_image.outputs.image_ref }}" \
            --web-image "${{ steps.web_image.outputs.image_ref }}" \
            --output release-dist

      - name: Seal publication inputs
        run: |
          previous="${{ needs.validate.outputs.previous_tag }}"
          range="$GITHUB_SHA"
          if [ "$previous" != none ]; then range="${previous}..${GITHUB_SHA}"; fi
          {
            printf 'API image: `%s`\n\n' "${{ steps.api_image.outputs.image_ref }}"
            printf 'Web image: `%s`\n\nChanges:\n' "${{ steps.web_image.outputs.image_ref }}"
            git log --format='- %s (%h)' "$range"
          } > release-dist/release-notes.md
          python3 scripts/stage-release-publication.py --directory release-dist \
            --tag "${{ needs.validate.outputs.next_tag }}" --commit "$GITHUB_SHA" \
            --api-image "${{ steps.api_image.outputs.image_ref }}" \
            --web-image "${{ steps.web_image.outputs.image_ref }}"

      - name: Attest CLI archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            release-dist/stuffstash_*.tar.gz
            release-dist/stuffstash_*.zip

      - name: Retain exact publication bytes for repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-publication
          path: release-dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.validate.outputs.next_tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.validate.outputs.next_tag }}"

      - name: Publish and verify release assets
        run: python3 scripts/publish-release-assets.py release-dist --repository "$GITHUB_REPOSITORY" --metadata verified-cli-release.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh verified download docs and self-host defaults
        id: metadata
        continue-on-error: true
        run: scripts/refresh-release-metadata.sh release-dist verified-cli-release.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report deferred documentation refresh
        if: steps.metadata.outcome == 'failure'
        run: echo 'Release published, but metadata PR/docs refresh needs attention. Retry with repair_run_id for this run.' >> "$GITHUB_STEP_SUMMARY"

  repair:
    name: Resume original publication bytes
    if: github.event_name == 'workflow_dispatch' && inputs.repair_run_id != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout trusted publication tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Verify original Release run
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
        run: |
          [[ "$REPAIR_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID" > original-run.json
          python3 - <<'PYRUN' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('original-run.json'))
          if value['path'] != '.github/workflows/release.yml' or value['head_branch'] != 'main' or value['status'] != 'completed':
              raise SystemExit('Repair requires a completed original Release run on main')
          print('commit='+value['head_sha'])
          PYRUN

      - name: Download original publication artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-publication
          path: release-dist
          run-id: ${{ inputs.repair_run_id }}
          github-token: ${{ github.token }}

      - name: Verify original commit and restore missing tag
        env:
          ORIGINAL_COMMIT: ${{ steps.original.outputs.commit }}
        run: |
          python3 - <<'PYPLAN'
          import json, os, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import importlib.util
          spec=importlib.util.spec_from_file_location('publication','scripts/publish-release-assets.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          plan=module.validate_plan(Path('release-dist'))
          if plan['commit'] != os.environ['ORIGINAL_COMMIT']:
              raise SystemExit('Artifact does not belong to the original run commit')
          subprocess.run(['git','merge-base','--is-ancestor',plan['commit'],'origin/main'],check=True)
          existing=subprocess.run(['git','rev-parse','--verify','refs/tags/'+plan['tag']],capture_output=True,text=True)
          if existing.returncode:
              subprocess.run(['git','tag',plan['tag'],plan['commit']],check=True)
              subprocess.run(['git','push','origin','refs/tags/'+plan['tag']],check=True)
          elif subprocess.check_output(['git','rev-parse',plan['tag']+'^{commit}'],text=True).strip()!=plan['commit']:
              raise SystemExit('Existing tag points at another commit')
          PYPLAN

      - name: Resume and verify release publication
        run: python3 scripts/publish-release-assets.py release-dist --repository "$GITHUB_REPOSITORY" --metadata verified-cli-release.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node for maintenance metadata
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Refresh verified download docs and self-host defaults
        run: scripts/refresh-release-metadata.sh release-dist verified-cli-release.json
        env:
          GH_TOKEN: ${{ github.token }}

  testflight:
    name: Publish iOS release to TestFlight
    needs: [validate, publish]
    if: needs.validate.outputs.release_required == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      release_tag: ${{ needs.validate.outputs.next_tag }}
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
