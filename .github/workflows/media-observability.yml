name: Media observability validation
on:
  workflow_dispatch:
  push:
    branches: [codex/media-observability]
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache-dependency-path: apps/api/go.sum
      - name: Test telemetry behavior
        run: go test -race -count=1 ./apps/api/internal/adapters/observability ./apps/api/internal/config
