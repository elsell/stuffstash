name: Media observability validation
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run codec benchmark and collect profiles
        type: boolean
        default: false
  push:
    branches: [codex/media-observability]
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache-dependency-path: apps/api/go.sum
      - name: Test telemetry behavior
        run: go test -race -count=1 ./apps/api/internal/app/clienttelemetry ./apps/api/internal/adapters/observability ./apps/api/internal/config ./apps/api/internal/adapters/httpserver ./apps/api/cmd/stuff-stash/internal/bootstrap
  collector-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache-dependency-path: apps/api/go.sum
      - name: Compile opt-in collector probe for remote validation
        run: |
          mkdir -p collector-probe
          go test -c ./apps/api/internal/adapters/observability -o collector-probe/observability.test
          git rev-parse HEAD > collector-probe/revision.txt
          sha256sum collector-probe/observability.test > collector-probe/sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collector-probe
          path: collector-probe/
          retention-days: 3
  codec-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache-dependency-path: apps/api/go.sum
      - name: Measure unchanged camera-photo codec
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/revision.txt
          go version > measurements/runtime.txt
          lscpu > measurements/cpu.txt
          set -o pipefail
          go test ./apps/api/internal/adapters/blobstore -run '^$' -bench '^BenchmarkCameraPhotoThumbnail$' -benchtime=5x -count=3 -benchmem -cpuprofile=measurements/cpu.pprof -memprofile=measurements/heap.pprof -o measurements/blobstore.test | tee measurements/codec.txt
      - name: Summarize profiles
        run: |
          go tool pprof -top -nodecount=20 measurements/blobstore.test measurements/cpu.pprof > measurements/cpu-top.txt
          go tool pprof -top -alloc_space -nodecount=20 measurements/blobstore.test measurements/heap.pprof > measurements/alloc-top.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: media-codec-measurements
          path: measurements/
          retention-days: 14
