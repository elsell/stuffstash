name: CLI platform contracts

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/printingprofiles/**'
      - 'packages/api-client/openapi.json'
      - 'scripts/check-cli-api-coverage.py'
      - '.github/workflows/cli-context-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'packages/printingprofiles/**'
      - 'packages/api-client/openapi.json'
      - 'scripts/check-cli-api-coverage.py'
      - '.github/workflows/cli-context-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-context:
    name: Windows CLI contracts
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          sparse-checkout: |
            apps/cli
            packages/printingprofiles
            packages/api-client
            scripts
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.25.8'
          cache: false
      - name: Verify API coverage inventory
        run: python ../../scripts/check-cli-api-coverage.py
      - name: Verify application contracts, input and private context storage
        run: go test -mod=readonly -timeout=2m ./internal/app ./internal/app/contexts ./internal/adapters/contextfile ./internal/adapters/inputfiles ./internal/adapters/presentation ./internal/adapters/terminal
      - name: Verify local command help
        run: go test -mod=readonly -timeout=2m ./internal/bootstrap -run 'Test(CommandHelp|Help)'
      - name: Verify Windows Credential Manager isolation
        run: go test -mod=readonly -timeout=2m ./internal/adapters/credentials -run '^TestWindowsKeyringBoundary$'
      - name: Build the Windows CLI
        run: go build -mod=readonly -buildvcs=false -o "$env:RUNNER_TEMP/stuffstash.exe" ./cmd/stuffstash
