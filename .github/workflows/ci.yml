name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"
  NODE_VERSION: "24.17.0"
  PNPM_VERSION: "11.0.7"

jobs:
  web-image:
    name: Web release image
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Build production web image
        run: docker build --file Dockerfile.web --tag stuffstash-web:ci .

  search-benchmark:
    name: Search PostgreSQL benchmark
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: search_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d search_benchmark"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - name: Measure search repository
        env:
          STUFF_STASH_TEST_POSTGRES_DSN: postgres://benchmark:benchmark@localhost:5432/search_benchmark?sslmode=disable&statement_timeout=10000
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=30s 8m go test -v -timeout=4m ./apps/api/internal/adapters/gormstore -run '^TestPostgres(StoreSearchAssets|Search|VoiceConfiguration|ConversationWorkflow|EvaluationCase|EvaluationRun)' -bench '^BenchmarkPostgresSearch' -benchtime=5x -count=3 -benchmem 2>&1 | tee search-benchmark.txt
      - name: Retain search measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-benchmark
          path: search-benchmark.txt
          retention-days: 14
      - name: Export API contract for client generation
        run: go run ./apps/api/cmd/stuff-stash-openapi > search-openapi.json
      - name: Retain API contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-openapi
          path: search-openapi.json
          retention-days: 3

  required-checks:
    name: Required checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Fetch main for manual diff checks
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin main

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Compile live voice regression executable
        if: github.event_name == 'workflow_dispatch'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o /tmp/voice-http.test ./apps/api/internal/adapters/httpserver

      - name: Retain live voice regression executable
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-voice-http-test
          path: /tmp/voice-http.test
          retention-days: 3

      - name: Run required checks
        run: make required-checks
        env:
          STUFF_STASH_STRUCTURAL_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && 'origin/main' || '' }}

      - name: Generate current API contract
        id: contract
        if: always()
        run: make api-client-generate

      - name: Retain compiled web preview
        if: ${{ !cancelled() && hashFiles('apps/web/build/index.html') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-web-preview
          path: apps/web/build
          retention-days: 7

      - name: Upload generated API contract
        if: ${{ always() && steps.contract.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-api-contract
          path: |
            packages/api-client/openapi.json
            packages/api-client/src/generated/schema.d.ts
          retention-days: 7

      - name: Check current API contract drift
        if: ${{ always() && steps.contract.outcome == 'success' }}
        run: git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/generated/schema.d.ts

  selfhost-runtime:
    name: Self-host runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Start and verify self-host topology
        run: |
          api_image="$(sed -n 's/^STUFF_STASH_API_IMAGE=//p' .env.example)"
          web_image="$(sed -n 's/^STUFF_STASH_WEB_IMAGE=//p' .env.example)"
          scripts/build-selfhost-release.sh \
            --version ci \
            --api-image "$api_image" \
            --web-image "$web_image" \
            --output selfhost-runtime-dist
          mkdir selfhost-runtime-dist/extracted
          tar -xzf selfhost-runtime-dist/stuffstash-selfhost.tar.gz -C selfhost-runtime-dist/extracted
          SELFHOST_RUNTIME_ROOT="$PWD/selfhost-runtime-dist/extracted/stuffstash-selfhost" \
            scripts/verify-selfhost-runtime.sh

  conversation-browser:
    name: Conversation browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Exercise conversation settings
        run: pnpm --dir apps/web exec playwright test conversation-workspace.spec.ts
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conversation-browser-evidence
          path: apps/web/test-results
          retention-days: 7

  ios-dependency-lock:
    name: iOS dependency lock
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EX_DEV_CLIENT_NETWORK_INSPECTOR: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve with pinned CocoaPods
        working-directory: apps/mobile/ios
        run: |
          test "$(pod --version)" = "1.17.0"
          pod install --no-repo-update

      - name: Verify committed lockfile
        run: git diff --exit-code -- apps/mobile/ios/Podfile.lock

      - name: Retain resolved lockfile
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-dependency-lock
          path: apps/mobile/ios/Podfile.lock
          retention-days: 3
