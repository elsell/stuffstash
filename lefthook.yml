pre-commit:
  parallel: false
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    go-test:
      glob: "*.go"
      run: GOCACHE="$PWD/.cache/go-build" go test ./apps/api/... ./apps/cli/...
    audit-action-migrations:
      run: python3 scripts/check-audit-action-migrations.py
    go-structural-rules:
      glob: "*.go"
      run: scripts/check-go-structural-rules.sh {staged_files}
    go-domain-imports:
      glob: "*.go"
      run: scripts/check-go-domain-imports.sh {staged_files}
    cli-client-check-generated:
      glob: "{apps/api/internal/adapters/httpserver/**,apps/api/cmd/stuff-stash-openapi/**,packages/api-client/openapi.json,apps/cli/oapi-codegen.yaml,apps/cli/internal/adapters/httpapi/generated/**,scripts/*cli-client*}"
      run: make cli-client-check-generated
    api-client-check-generated:
      glob: "packages/api-client/**"
      run: make api-client-check-generated
    api-client-test:
      glob: "packages/api-client/**"
      run: make api-client-test api-client-check
    web-test:
      glob: "apps/web/**"
      run: make web-test web-check
    client-message-check:
      glob: "{apps/mobile/src/**,apps/web/src/**,packages/localization/**,scripts/client-message-check*}"
      run: make client-message-check
    mobile-ui-structural-check:
      glob: "apps/mobile/src/**/*.{ts,tsx,xml}"
      run: make mobile-ui-structural-check
    docs-build:
      glob: "docs/**"
      run: make docs-build
    dependency-age-check:
      glob: "{**/go.mod,**/go.sum,**/package.json,**/pnpm-lock.yaml}"
      run: make dependency-age-check
    scripts-test:
      glob: "{scripts/**,compose.selfhost.yaml,.env.example,docs/src/content/docs/self-hosting.md,specs/platform/local-development-topology.spec.md}"
      run: make scripts-test
