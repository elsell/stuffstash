plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.stuffstash.archives'
version = '1.0.0'
android {
  namespace 'app.stuffstash.archives'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Resolved to the app's pinned React Native version by its Gradle plugin.
  // ExpoModulesCore's implementation dependency is not exported to this module.
  implementation 'com.facebook.react:react-android'
}
